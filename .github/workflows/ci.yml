name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        swift: ["6.2"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Core/flight-core

      # flight-core depends on flight-config by relative path, which keeps
      # local cross-package development immediate: edit one, rebuild the
      # other, no tagging round trip. The cost is that a standalone checkout
      # has no sibling to resolve against, so CI reconstructs the layout the
      # manifest expects.
      #
      # While these repositories are private, that needs a token with read
      # access to the organization. Set SWIFTFLIGHT_CI_TOKEN to a fine-grained
      # PAT (Contents: read) or the checkout below will fail with a clear
      # message rather than a confusing "folder doesn't exist".
      - name: Check the sibling-repository token is present
        run: |
          if [ -z "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            echo "::error::SWIFTFLIGHT_CI_TOKEN is not set. flight-core resolves"
            echo "::error::flight-config by relative path, and this repository is"
            echo "::error::private, so CI needs a token with read access to"
            echo "::error::Swift-Flight/flight-config to reconstruct the layout."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-config
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Config/flight-config

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Build (warnings are errors)
        working-directory: Core/flight-core
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        working-directory: Core/flight-core
        run: swift test

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      # Fails the job on any DocC warning, so a broken symbol link or an
      # unresolved guide reference cannot land on main.
      - name: Generate documentation
        env:
          FLIGHT_CORE_BUILD_DOCS: "1"
        working-directory: Core/flight-core
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target FlightCore \
            --warnings-as-errors --output-path ./docs
