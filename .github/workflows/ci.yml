name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3.3"]
    # The official image pins the exact patch release. swift-actions/setup-swift
    # only accepts a minor version, and "6.2" was resolving to 6.2.1.
    container: swift:${{ matrix.swift }}

    steps:
      - uses: actions/checkout@v4


      # --enable-all-traits: a root build compiles every target, but only
      # traits that are enabled bring their dependencies. Without this the
      # Security target would be built with JWTKit pruned and fail.
      - name: Build (Flight's own warnings are errors)
        env:
          FLIGHT_STRICT_WARNINGS: "1"
        run: swift build --enable-all-traits

      - name: Test
        run: ./CI/run-tests.sh

      # A root build compiles every target regardless of traits, so it cannot
      # verify the lean configuration. This builds an actual consumer and
      # fails if any gated dependency leaked into its resolution.
      - name: Lean consumer resolves no gated dependency
        run: ./CI/check-lean-consumer.sh

  lint:
    # Advisory only. Seven of the eight merged packages predate the shared
    # .swift-format config, leaving ~1240 violations; the macro fixture
    # suites in particular hold expected-expansion string literals that a
    # bulk reformat would corrupt. This job reports drift without blocking
    # merges until that reformat lands as its own reviewed change.
    name: Format (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4


      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # Every module with a .docc catalogue, each with --warnings-as-errors:
      # an unresolved symbol link, a doc comment naming a renamed parameter,
      # or a Topics entry pointing at a symbol that no longer exists all fail
      # the job. Documentation that nothing checks rots into documentation
      # that is wrong, which is worse than none.
      - name: Generate documentation
        env:
          FLIGHT_BUILD_DOCS: "1"
        run: |
          for target in FlightCore FlightConfig FlightWeb FlightChannels \
                        FlightPubSub FlightActuator FlightSecurityCore \
                        FlightWebTesting FlightTransport; do
            echo "::group::$target"
            swift package --enable-all-traits \
              --allow-writing-to-directory "./docs/$target" \
              generate-documentation --target "$target" \
              --warnings-as-errors --output-path "./docs/$target"
            echo "::endgroup::"
          done

  macos:
    name: Build on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 6.2 rather than the 6.3.3 the Linux jobs use: setup-swift does not
      # index 6.3 yet. It satisfies the package's tools version, so the job
      # still answers what it exists to answer — whether the
      # platforms: [.macOS(.v15)] claim actually compiles.
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Build
        run: swift build --enable-all-traits
