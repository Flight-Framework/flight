name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]

    steps:
      - name: Check the sibling-repository token is present
        run: |
          if [ -z "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            echo "::error::SWIFTFLIGHT_CI_TOKEN is not set. flight-web resolves"
            echo "::error::flight-config, flight-core by relative path, and these repositories are"
            echo "::error::private, so CI needs a token with read access to them."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: Web/flight-web

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-config
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Config/flight-config

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-core
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Core/flight-core

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Build (warnings are errors)
        working-directory: Web/flight-web
        run: swift build -Xswiftc -warnings-as-errors

      # Building the test target separately: a package whose sources compile
      # while its tests do not is exactly what a cached local build hides.
      - name: Build tests
        working-directory: Web/flight-web
        run: swift build --build-tests

      - name: Test
        working-directory: Web/flight-web
        run: swift test
