name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]

    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      # --enable-all-traits: a root build compiles every target, but only
      # traits that are enabled bring their dependencies. Without this the
      # Security target would be built with JWTKit pruned and fail.
      - name: Build (warnings are errors)
        run: swift build --enable-all-traits -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --enable-all-traits

      # The lean configuration is a supported consumption mode, so it is
      # built too: this is what a consumer using only the container gets.
      - name: Build with defaults disabled
        run: swift build --disable-default-traits

  lint:
    # Advisory only. Seven of the eight merged packages predate the shared
    # .swift-format config, leaving ~1240 violations; the macro fixture
    # suites in particular hold expected-expansion string literals that a
    # bulk reformat would corrupt. This job reports drift without blocking
    # merges until that reformat lands as its own reviewed change.
    name: Format (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests
